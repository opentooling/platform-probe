{{- $fn := include "platform-probe.fullname" . }}
{{- $u := dict "ctx" . }}
{{- $sa := dict "ctx" . }}
{{- $v := .Values }}
{{- /* Everything the console needs to know, from these values only. Read by platform_probe/config.py, which rejects keys it does not know. */}}
{{- $argoInstances := list }}
{{- range .Values.suites.argocd.instances }}
{{- $d := .deploy | default dict }}
{{- $argoInstances = append $argoInstances (dict
  "name" (.name | default "")
  "namespace" .namespace
  "argocd" (.argocd | default "")
  "applications" (ternary .applications true (hasKey . "applications"))
  "failOnOutOfSync" (ternary .failOnOutOfSync true (hasKey . "failOnOutOfSync"))
  "ignore" (.ignore | default list)
  "deploy" (dict
    "enabled" ($d.enabled | default false)
    "project" ($d.project | default "default")
    "repoUrl" ($d.repoURL | default "")
    "path" ($d.path | default "")
    "revision" ($d.revision | default "HEAD")
    "timeout" ($d.timeout | default "3m"))) }}
{{- end }}
{{- $pullSecrets := list }}
{{- range .Values.imagePullSecrets }}{{ $pullSecrets = append $pullSecrets .name }}{{ end }}
{{- $config := dict
  "release" .Release.Name
  "namespace" .Release.Namespace
  "trustDomain" $v.trustDomain
  "gateway" (dict
    "name" $v.gateway.name
    "namespace" $v.gateway.namespace
    "serviceAccount" (include "platform-probe.gatewaySA" .)
    "host" $v.gateway.hostname
    "address" $v.gateway.address
    "httpPort" (int $v.gateway.httpPort)
    "httpsPort" (int $v.gateway.httpsPort)
    "issuerContains" $v.gateway.tls.issuerContains
    "insecureSkipVerify" $v.gateway.tls.insecureSkipVerify)
  "kuadrant" (dict "namespace" $v.kuadrant.namespace)
  "services" (dict
    "frontend" (include "platform-probe.url" (dict "ctx" . "svc" "frontend"))
    "catalog" (include "platform-probe.url" (dict "ctx" . "svc" "catalog"))
    "catalogV1" (include "platform-probe.url" (dict "ctx" . "svc" "catalog-v1"))
    "catalogV2" (include "platform-probe.url" (dict "ctx" . "svc" "catalog-v2"))
    "outsider" (include "platform-probe.url" (dict "ctx" . "svc" "outsider")))
  "serviceAccounts" (dict
    "frontend" (include "platform-probe.sa" (dict "ctx" . "role" "frontend"))
    "catalog" (include "platform-probe.sa" (dict "ctx" . "role" "catalog"))
    "pricing" (include "platform-probe.sa" (dict "ctx" . "role" "pricing"))
    "console" (include "platform-probe.sa" (dict "ctx" . "role" "console")))
  "expect" (dict
    "defaultDeny" $v.expect.defaultDeny
    "httpRedirect" $v.expect.httpRedirect
    "strictMTLS" $v.mesh.strictMTLS
    "authorizationPolicies" $v.mesh.authorizationPolicies
    "trafficManagement" $v.mesh.trafficManagement
    "networkPolicies" $v.networkPolicies.enabled)
  "limits" (dict
    "public" $v.rateLimits.public
    "free" $v.rateLimits.plans.free
    "gold" $v.rateLimits.plans.gold)
  "routes" (dict "splitV2Percent" (int $v.routes.splitV2Percent) "timeout" $v.routes.timeout)
  "mesh" (dict "splitV2Percent" (int $v.mesh.splitV2Percent))
  "egress" (dict
    "registryOnly" $v.mesh.egress.registryOnly
    "blockedUrl" $v.mesh.egress.blockedUrl
    "allowedUrl" $v.mesh.egress.allowedUrl)
  "apiKeys" (dict "prefix" $v.auth.apiKeys.prefix "dir" "/etc/platform-probe/apikeys")
  "oidc" (dict
    "enabled" $v.auth.oidc.enabled
    "issuerUrl" $v.auth.oidc.issuerUrl
    "clientId" $v.auth.oidc.clientId
    "scope" $v.auth.oidc.scope
    "clientSecretFile" "/etc/platform-probe/oidc/client-secret")
  "caFile" (ternary "/etc/platform-probe/ca/ca-bundle.crt" "" (ne (include "platform-probe.caConfigMap" .) ""))
  "image" (include "platform-probe.image" .)
  "scratch" (dict
    "namespace" (include "platform-probe.scratchNamespace" .)
    "caConfigMap" (include "platform-probe.caConfigMap" .)
    "backendService" (ternary (printf "%s-ingress-backend" $fn) "" $v.suites.ingress.enabled)
    "caKey" (ternary $v.trustedCA.key "ca-bundle.crt" (ne $v.trustedCA.configMap ""))
    "imagePullSecrets" $pullSecrets)
  "suites" (dict
    "ingress" (dict
      "enabled" $v.suites.ingress.enabled
      "certExpiryDays" (int $v.suites.ingress.certExpiryDays)
      "certManagerIssuer" (dict "name" $v.suites.ingress.certManager.issuer.name "kind" $v.suites.ingress.certManager.issuer.kind))
    "workloads" (dict
      "enabled" $v.suites.workloads.enabled
      "expectedScc" $v.suites.workloads.expectedScc
      "expectQuota" $v.suites.workloads.expectQuota
      "expectClusterQuota" $v.suites.workloads.expectClusterQuota
      "expectLimitRange" $v.suites.workloads.expectLimitRange)
    "storage" (dict
      "enabled" $v.suites.storage.enabled
      "storageClasses" $v.suites.storage.storageClasses
      "snapshotClass" $v.suites.storage.snapshotClass
      "size" $v.suites.storage.size
      "podTimeout" $v.suites.storage.podTimeout)
    "observability" (dict
      "enabled" $v.suites.observability.enabled
      "grafanaUrl" $v.suites.observability.grafana.url
      "tokenFile" "/etc/platform-probe/grafana/token"
      "datasources" $v.suites.observability.grafana.datasources
      "labels" $v.suites.observability.labels
      "metricsMethod" $v.suites.observability.metrics.method
      "metricsPort" (int $v.suites.observability.metrics.port)
      "podAnnotations" $v.suites.observability.metrics.podAnnotations
      "otlpEndpoint" $v.suites.observability.otlp.endpoint
      "timeout" $v.suites.observability.timeout)
    "argocd" (dict
      "enabled" $v.suites.argocd.enabled
      "instances" $argoInstances)
    "metallb" (dict
      "enabled" $v.suites.metallb.enabled
      "namespace" $v.suites.metallb.namespace
      "bgpNamespace" $v.suites.metallb.bgpNamespace
      "service" (ternary (printf "%s-metallb" $fn) "" $v.suites.metallb.enabled)
      "pool" $v.suites.metallb.pool
      "minFreeAddresses" (int $v.suites.metallb.minFreeAddresses)
      "timeout" $v.suites.metallb.timeout))
}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fn }}-config
  labels:
    {{- include "platform-probe.labels" . | nindent 4 }}
data:
  config.json: |
    {{- $config | toPrettyJson | nindent 4 }}
{{- if and .Values.trustedCA.openshiftInjected (not .Values.trustedCA.configMap) }}
---
# OpenShift fills ca-bundle.crt with the cluster trust bundle. Leave data empty.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fn }}-ca-bundle
  labels:
    {{- include "platform-probe.labels" . | nindent 4 }}
    config.openshift.io/inject-trusted-cabundle: "true"
{{- end }}
