{{- if include "platform-probe.writeSuites" . }}
{{- $fn := include "platform-probe.fullname" . }}
{{- $ns := include "platform-probe.scratchNamespace" . }}
{{- /*
The scratch namespace: where the platform suites (suites.ingress, .workloads, .storage) create
their test objects. The console may create and delete there, and nowhere else.
*/}}
{{- if .Values.scratch.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  {{- /* Yours, then the chart's on top: Helm and the console rely on those. */}}
  {{- $labels := fromYaml (include "platform-probe.labels" .) }}
  {{- with .Values.scratch.labels }}
  {{- $labels = merge $labels (fromYaml (tpl (toYaml .) $)) }}
  {{- end }}
  labels:
    {{- toYaml $labels | nindent 4 }}
  {{- with .Values.scratch.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fn }}-scratch
  namespace: {{ $ns }}
  labels:
    {{- include "platform-probe.labels" . | nindent 4 }}
rules:
  # Test pods (task pods, the ingress backend) and the dry runs of pods admission must refuse.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
  {{- if .Values.suites.ingress.enabled }}
  # Routes to the backend Service below. The console may not create Services, which would
  # let it take traffic meant for other pods.
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["create", "get", "list", "delete"]
  {{- end }}
  {{- if or (and .Values.suites.ingress.enabled .Values.suites.ingress.certManager.issuer.name) .Values.suites.pki.enabled }}
  # Test Certificates (ingress' cert-manager check, the internal CA).
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["create", "get", "list", "delete"]
  {{- end }}
  {{- if and .Values.suites.pki.enabled (eq .Values.suites.pki.issuer.kind "Issuer") }}
  - apiGroups: ["cert-manager.io"]
    resources: ["issuers"]
    verbs: ["get"]
  {{- end }}
  {{- if .Values.suites.metallb.enabled }}
  # Read the MetalLB test Service's address. Reading only: creating Services isn't allowed.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
  {{- end }}
  {{- if .Values.suites.workloads.enabled }}
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["list"]
  # The ClusterResourceQuotas that cover the scratch namespace (OpenShift).
  - apiGroups: ["quota.openshift.io"]
    resources: ["appliedclusterresourcequotas"]
    verbs: ["list"]
  {{- end }}
  {{- if .Values.suites.storage.enabled }}
  # PVCs, patched to test expansion, and snapshots of them.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "patch", "delete"]
  {{- if .Values.suites.storage.snapshotClass }}
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["create", "get", "list", "delete"]
  {{- end }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fn }}-scratch
  namespace: {{ $ns }}
  labels:
    {{- include "platform-probe.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fn }}-scratch
subjects:
  - kind: ServiceAccount
    name: {{ include "platform-probe.sa" (dict "ctx" . "role" "console") }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.suites.ingress.enabled }}
---
# The ingress checks' backend: each run starts a pod with the backend label, serving HTTP on
# 8080 and HTTPS on 8443 with the certificate OpenShift's service CA puts in <name>-tls.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-ingress-backend
  namespace: {{ $ns }}
  labels:
    {{- include "platform-probe.labels" . | nindent 4 }}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: {{ $fn }}-ingress-backend-tls
spec:
  selector:
    platform-probe/release: {{ .Release.Name }}
    platform-probe/backend: "true"
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: https
      port: 8443
      targetPort: 8443
      protocol: TCP
{{- end }}
{{- if .Values.suites.pki.enabled }}
---
# The internal CA checks' Service: each run starts a pod serving the certificate the CA issued
# for this Service's cluster names, and connects to it by them.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-pki
  namespace: {{ $ns }}
  labels:
    {{- include "platform-probe.labels" . | nindent 4 }}
spec:
  selector:
    platform-probe/release: {{ .Release.Name }}
    platform-probe/pki-server: "true"
  ports:
    - name: https
      port: 8443
      targetPort: 8443
      protocol: TCP
{{- end }}
{{- if .Values.suites.metallb.enabled }}
---
# The MetalLB check's LoadBalancer Service, in front of the same backend pod each run starts.
# It holds one address from the pool while the release is installed.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-metallb
  namespace: {{ $ns }}
  labels:
    {{- include "platform-probe.labels" . | nindent 4 }}
  {{- with .Values.suites.metallb.pool }}
  annotations:
    metallb.io/address-pool: {{ . }}
    metallb.universe.tf/address-pool: {{ . }}
  {{- end }}
spec:
  type: LoadBalancer
  selector:
    platform-probe/release: {{ .Release.Name }}
    platform-probe/backend: "true"
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
{{- end }}
{{- if and .Values.trustedCA.openshiftInjected (not .Values.trustedCA.configMap) }}
---
# The cluster trust bundle for the test pods, which check the router's certificate with it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fn }}-ca-bundle
  namespace: {{ $ns }}
  labels:
    {{- include "platform-probe.labels" . | nindent 4 }}
    config.openshift.io/inject-trusted-cabundle: "true"
{{- end }}
{{- end }}
