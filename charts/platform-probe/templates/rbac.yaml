{{- $fn := include "platform-probe.fullname" . }}
{{- $sa := include "platform-probe.sa" (dict "ctx" . "role" "console") }}
# Read-only: the platform checks read the status of the gateway, the Kuadrant CR and policies;
# the platform suites read IngressControllers and StorageClasses. Writes are in scratch.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ $fn }}-console
  labels:
    {{- include "platform-probe.labels" . | nindent 4 }}
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes"]
    verbs: ["get", "list"]
  - apiGroups: ["kuadrant.io"]
    resources: ["kuadrants", "authpolicies", "ratelimitpolicies"]
    verbs: ["get", "list"]
  # The NetworkPolicy check reads its own namespace's labels, which namespaceSelectors match;
  # the workload checks read the scratch namespace's UID range.
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames:
      - {{ .Release.Namespace | quote }}
      {{- if include "platform-probe.writeSuites" . }}
      - {{ include "platform-probe.scratchNamespace" . | quote }}
      {{- end }}
    verbs: ["get"]
  {{- if .Values.suites.ingress.enabled }}
  - apiGroups: ["operator.openshift.io"]
    resources: ["ingresscontrollers"]
    verbs: ["get"]
  {{- end }}
  {{- if and .Values.suites.pki.enabled (eq .Values.suites.pki.issuer.kind "ClusterIssuer") }}
  - apiGroups: ["cert-manager.io"]
    resources: ["clusterissuers"]
    resourceNames: [{{ .Values.suites.pki.issuer.name | quote }}]
    verbs: ["get"]
  {{- end }}
  {{- if .Values.suites.storage.enabled }}
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ $fn }}-console
  labels:
    {{- include "platform-probe.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ $fn }}-console
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
---
# The sidecar check lists the release's own pods. When the NetworkPolicy check fails, it lists
# the namespace's NetworkPolicies to name the ones that let the call through.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fn }}-console
  labels:
    {{- include "platform-probe.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fn }}-console
  labels:
    {{- include "platform-probe.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fn }}-console
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
