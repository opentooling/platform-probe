{{- if .Values.tests.enabled }}
{{- /*
`helm test`: run the whole suite on the console and fail if any check fails. The pod has no
sidecar (a sidecar would keep it from ever completing), which is why the console accepts
plaintext on its port.
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "platform-probe.fullname" . }}-test-suite
  labels:
    {{- include "platform-probe.componentSelector" (dict "ctx" . "component" "test") | nindent 4 }}
    sidecar.istio.io/inject: "false"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    {{- include "platform-probe.podSecurityContext" . | nindent 4 }}
  containers:
    - name: suite
      image: {{ include "platform-probe.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      args: ["check", "--url", {{ include "platform-probe.url" (dict "ctx" . "svc" "console") | quote }}]
      securityContext:
        {{- include "platform-probe.containerSecurityContext" . | nindent 8 }}
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 200m, memory: 96Mi }
{{- end }}
