# platform-probe: a demo app (frontend → catalog v1/v2 → pricing) plus a console that sends traffic
# through your API gateway and between the services, and reports which features work.
#
# Install it into its own namespace. The namespace needs the label your gateway uses to accept
# routes (api-gateway-access=true on the RHCL platform):
#   oc new-project platform-probe && oc label namespace platform-probe api-gateway-access=true

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/opentooling/platform-probe
  # Empty = the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The Gateway the probe's routes attach to, and how the console reaches it.
gateway:
  name: api-gateway
  namespace: api-gateway
  # Listener to attach to.
  sectionName: https
  # Hostname of the probe's routes. It must fall under the listener's hostname. No DNS record
  # is needed: the console dials the gateway's address directly.
  hostname: probe.api.example.internal
  # Where the console connects for that hostname. Empty = the gateway's Service,
  # <name>-istio.<namespace>.svc. With mesh.egress.registryOnly, an IP here is blocked.
  address: ""
  httpPort: 80
  httpsPort: 443
  # ServiceAccount of the gateway's pods, whose SPIFFE ID the apps expect. Empty = <name>-istio.
  serviceAccount: ""
  tls:
    # If set, the gateway certificate's issuer must contain this, e.g. "internal-ca".
    issuerContains: ""
    # Skip certificate verification. The TLS check then only reports the issuer.
    insecureSkipVerify: false

# Namespace of the Kuadrant CR (and of Authorino).
kuadrant:
  namespace: kuadrant-system

# What the platform itself is expected to enforce. A check for something switched off here is
# reported as skipped, not failed.
expect:
  # A deny-all AuthPolicy on the gateway: routes without their own AuthPolicy get 403.
  defaultDeny: true
  # An HTTP→HTTPS redirect on the gateway's port 80.
  httpRedirect: true

# The mesh's trust domain, used in SPIFFE IDs and AuthorizationPolicy principals.
trustDomain: cluster.local

# CA bundle the console trusts, to verify the gateway's certificate and the IdP's.
trustedCA:
  # A ConfigMap that OpenShift fills with the cluster trust bundle (public CAs + the proxy's
  # trustedCA). On other clusters it stays empty and only the system CAs are trusted.
  openshiftInjected: true
  # Or your own ConfigMap in the release namespace. Takes precedence over openshiftInjected.
  configMap: ""
  key: ca-bundle.crt

auth:
  # Two API-key callers, which the checks rely on:
  #   alice: plan gold, group admin (may POST)
  #   bob:   plan free, no group     (may not POST, limited to rateLimits.plans.free)
  apiKeys:
    # Where Authorino reads API-key Secrets from.
    namespace: kuadrant-system
    # Header format: "Authorization: APIKEY <key>".
    prefix: APIKEY
    # Create the key Secrets. Turn off to bring your own, e.g. ExternalSecrets from Vault in
    # extraObjects (see examples/). You then provide:
    #   - one Secret per user in auth.apiKeys.namespace, with the api_key field, the labels
    #     authorino.kuadrant.io/managed-by: authorino and
    #     platform-probe/api: {{ include "platform-probe.apiKeySelector" $ }}, and the annotations
    #     secret.kuadrant.io/user-id, secret.kuadrant.io/plan-id and platform-probe/groups
    #   - <fullname>-apikeys in the release namespace, with the fields alice and bob, which
    #     the console reads
    create: true
    # With create: leave empty to generate keys on install and keep them on upgrade. Under
    # Argo CD, which renders without cluster access, set them, or they change on every sync.
    alice: ""
    bob: ""

  # Also accept OIDC access tokens. The console gets one with the client credentials grant.
  oidc:
    enabled: false
    issuerUrl: ""
    clientId: ""
    scope: ""
    clientSecret:
      # Secret in the release namespace holding the client secret.
      existingSecret: ""
      key: client-secret

rateLimits:
  # The public route, shared by everyone.
  public:
    limit: 5
    window: 10s
  # Per caller on the protected routes. The checks send dozens of requests as alice, so keep
  # gold high; bob's free limit is the one the checks exceed on purpose.
  plans:
    free:
      limit: 3
      window: 10s
    gold:
      limit: 300
      window: 10s
  total:
    limit: 1000
    window: 10s

# Gateway features.
routes:
  # Share of /split the gateway sends to catalog v2.
  splitV2Percent: 10
  # Request timeout on /timeout.
  timeout: 2s

mesh:
  # Sidecar injection. Empty = the label sidecar.istio.io/inject: "true", which the default
  # revision (an Istio CR named "default") honours. Set a revision name to use istio.io/rev.
  revision: ""
  # STRICT mTLS for the demo services: a PeerAuthentication on their pods.
  strictMTLS: true
  # AuthorizationPolicies: only the gateway and frontend may call catalog, only catalog may
  # call pricing.
  authorizationPolicies: true
  # VirtualServices and DestinationRules for the east-west split, retries, fault injection,
  # timeouts and outlier detection.
  trafficManagement: true
  # Share of frontend → catalog calls the mesh sends to catalog v2.
  splitV2Percent: 10
  egress:
    # Limit the console to hosts in the mesh's registry (a Sidecar with REGISTRY_ONLY).
    registryOnly: true
    # Must be refused (502 from the sidecar). Nothing needs to answer on it.
    blockedUrl: http://example.com/
    # External hosts the console may reach (a ServiceEntry each, HTTPS on 443). The OIDC
    # issuer's host is added automatically.
    allowedHosts: []
    # Optional URL on one of allowedHosts, to check it is reachable.
    allowedUrl: ""

# Ingress NetworkPolicies: only the gateway reaches frontend; each service accepts only its
# callers. The checks call frontend from a pod outside the mesh and expect a timeout.
networkPolicies:
  enabled: true

# Platform suites: what a team gets from the platform, beyond the gateway and the mesh. Each is
# off by default and, when on, adds its checks to the console and to `helm test`. They create
# test objects (pods, Routes, PVCs...) in the scratch namespace, labelled with the run, and
# delete them when the run ends.
scratch:
  # Where the test objects go. Empty = <release namespace>-scratch.
  namespace: ""
  # Create the namespace with the chart. Turn off to bring your own, made with
  # `oc new-project`: it then gets your project template (ResourceQuota, LimitRange,
  # NetworkPolicies) the way a tenant's namespace does, and the workload checks test those.
  # Either way the console gets a Role there, and nothing outside it.
  create: true
  # Labels and annotations for the namespace the chart creates (ignored with create: false):
  # whatever your platform keys on for a tenant namespace, so the suites see what a team sees.
  # Values are rendered with tpl, so {{ .Release.Namespace }} and the chart's helpers work.
  #   labels:
  #     logging.example.com/collect: "true"          # opt in to log collection
  #     pod-security.kubernetes.io/enforce: restricted
  #   annotations:
  #     openshift.io/node-selector: node-role.kubernetes.io/worker=
  #     openshift.io/requester: "{{ .Release.Namespace }}"
  labels: {}
  annotations: {}

suites:
  # Routes (edge, reencrypt, passthrough) reached from a pod in the scratch namespace, the
  # router's certificate, and optionally cert-manager.
  ingress:
    enabled: false
    # Fail when the router's certificate expires within this many days.
    certExpiryDays: 14
    certManager:
      # An issuer to request a test certificate from (e.g. a Vault ClusterIssuer). Empty = skip
      # the cert-manager check.
      issuer:
        name: ""
        kind: ClusterIssuer
      # What the test Certificate asks for: names the issuer allows (a Vault PKI role's
      # allowed_domains). {run} (changes every run, so the issuer issues anew), {namespace}
      # (the scratch namespace) and {release} are filled in. Empty = no common name, and the
      # DNS name probe-cert-{run}.{namespace}.svc.
      #   commonName: "probe-{run}.apps.example.com"
      #   dnsNames: ["probe-{run}.apps.example.com"]
      commonName: ""
      dnsNames: []
      # What the issued certificate must look like, as regular expressions over the whole name.
      # With commonNamePattern, a certificate without a common name fails too. A pod reads the
      # certificate from its Secret; the console needs no access to Secrets.
      expect:
        commonNamePattern: ""
        dnsNamePattern: ""
  # SCC and Pod Security: the UID and SCC a tenant pod gets, and that privileged, root,
  # hostPath and hostNetwork pods are refused (server-side dry runs: nothing is created).
  workloads:
    enabled: false
    expectedScc: restricted-v2
    # Fail, rather than skip, when the scratch namespace has no ResourceQuota, isn't covered by
    # a ClusterResourceQuota (OpenShift: they select namespaces by label or annotation, see
    # scratch.labels), or has no LimitRange.
    expectQuota: false
    expectClusterQuota: false
    expectLimitRange: false
  # PVCs: provisioning, data kept between pods, expansion, snapshot and restore.
  storage:
    enabled: false
    # StorageClasses to test. Empty = the default one.
    storageClasses: []
    # VolumeSnapshotClass for the snapshot check. Empty = skip it.
    snapshotClass: ""
    size: 1Gi
    # How long a test pod may take to schedule, attach its volume and finish.
    podTimeout: 3m
  # Telemetry from a pod in the scratch namespace reaches the central Grafana stack: a log line
  # in Loki, a metric in Mimir, a span in Tempo, each marked with the run and found through
  # Grafana's data source proxy. Each check reports how long its signal took.
  observability:
    enabled: false
    grafana:
      # Reachable from the console, on 443. Its host gets a mesh egress entry.
      url: ""
      # A Grafana service account token (Viewer is enough), in a Secret in the release namespace.
      token:
        existingSecret: ""
        key: token
      # Data source UIDs (Connections → Data sources → the UID in the URL). Empty = skip that
      # signal. With a multi-tenant stack, the data source sends this cluster's tenant ID.
      datasources:
        loki: ""
        mimir: ""
        tempo: ""
    # What Loki and Mimir call the pod's namespace and name, and labels added to every query to
    # pick this cluster, e.g. {cluster: prod-eu-1}.
    labels:
      namespace: namespace
      pod: pod
      extra: {}
    metrics:
      # annotations: the test pod serves platform_probe_marker on metrics.port and carries
      # podAnnotations, for a collector that discovers pods that way.
      # otlp: the test pod pushes it to otlp.endpoint instead.
      method: annotations
      port: 9090
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    otlp:
      # The collector's OTLP/HTTP receiver, e.g. http://alloy.alloy.svc:4318. Needed for the
      # trace check (and for metrics.method otlp); empty skips it.
      endpoint: ""
    # How long a signal may take to show up in Grafana.
    timeout: 3m
  # Internal CA: a cluster-local CA, through a cert-manager issuer, issues a certificate for a
  # Service's cluster names (<svc>.<ns>.svc and <svc>.<ns>.svc.<clusterDomain>), a pod serves
  # it behind a Service the chart creates in the scratch namespace, and another pod connects
  # by those names trusting only the CA bundle workloads are given.
  pki:
    enabled: false
    issuer:
      name: ""
      kind: ClusterIssuer   # or Issuer, in the scratch namespace
    clusterDomain: cluster.local
    # The CA bundle workloads trust, as a ConfigMap in the scratch namespace (e.g. a
    # trust-manager Bundle's target). Empty = the scratch namespace's CA bundle (trustedCA).
    trustBundle:
      configMap: ""
      key: ca.crt
    # If set, the served certificate's issuer must contain this, e.g. "cluster-ca".
    issuerContains: ""
    # How long issuing, and starting the test server, may take.
    timeout: 2m
  # MetalLB: controller and speakers ready, every address pool advertised (L2 or BGP) with
  # addresses left and BGP sessions up, and a LoadBalancer Service that gets an address from
  # the pool, is announced and carries traffic from a pod. The chart creates that Service in the
  # scratch namespace (it holds one address while installed); the console only reads MetalLB's
  # resources, with a Role in its namespace.
  metallb:
    enabled: false
    namespace: metallb-system
    # Where frr-k8s keeps BGPSessionStates, if not in namespace (e.g. openshift-frr-k8s).
    bgpNamespace: ""
    # The IPAddressPool the test Service asks for. Empty = MetalLB picks an autoAssign pool.
    pool: ""
    # Fail when a pool that reports its usage (MetalLB 0.15+) has fewer free addresses.
    minFreeAddresses: 1
    # How long the Service may take to get its address.
    timeout: 2m
  # Argo CD instances (e.g. one for the platform, one for teams' applications): each is
  # available, its Applications are synced and healthy, and, with deploy on, a team can deploy
  # through it. The console gets a Role in each instance's namespace: read ArgoCD resources
  # and Applications, and with deploy on, create and delete Applications.
  argocd:
    enabled: false
    instances:
      - name: platform
        namespace: openshift-gitops
        # The ArgoCD resource's name. Empty = the one in the namespace.
        argocd: ""
        # Check the instance's Applications: Degraded, Missing, failed syncs and error
        # conditions (e.g. an unreachable repo) fail; OutOfSync too unless turned off.
        applications: true
        failOnOutOfSync: true
        # Applications to leave out, by name.
        ignore: []
        # Deploy a test Application through this instance (see the applications example).
        deploy:
          enabled: false
      # - name: applications
      #   namespace: gitops-apps
      #   deploy:
      #     # Creates an Application that syncs argocd/probe-app (one ConfigMap) into the scratch
      #     # namespace, waits for Synced and Healthy, then deletes it, pruning the ConfigMap.
      #     # The instance must manage the scratch namespace: on OpenShift GitOps, add
      #     # scratch.labels: {argocd.argoproj.io/managed-by: gitops-apps}.
      #     enabled: true
      #     project: default
      #     repoURL: https://github.com/opentooling/platform-probe   # or your mirror
      #     path: argocd/probe-app
      #     revision: main
      #     timeout: 3m

# Python services use about 30Mi each, the console about 35Mi.
resources:
  requests:
    cpu: 10m
    memory: 40Mi
  limits:
    cpu: 200m
    memory: 96Mi
consoleResources:
  requests:
    cpu: 20m
    memory: 48Mi
  limits:
    cpu: 500m
    memory: 192Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# `helm test` runs one pod per check category (platform, gateway, mesh, then each enabled
# suite: ingress, workloads, storage, observability, argocd, metallb), one after another; each
# fails if any check in its category fails. tests.categories picks which ones; at test time,
# --filter picks among them (repeat it, or exclude with !):
#   helm test <release> --filter name=<release>-platform-probe-test-<category>
#   helm test <release> --filter '!name=<release>-platform-probe-test-storage'
tests:
  enabled: true
  # The categories `helm test` runs; empty = every enabled one. E.g. [platform, gateway] for a
  # quick check after a gateway change. A category whose suite is off can't be listed.
  categories: []
  # How long one category may take. Storage, with volumes attaching, takes the longest.
  timeout: 20m

# -- Extra Kubernetes objects to deploy with the release: ExternalSecrets for the API keys, an
# OpenShift Route for the console, policies of your own. Items can be YAML objects or strings;
# both are rendered with `tpl`, so expressions such as {{ include "platform-probe.fullname" $ }}
# and {{ .Release.Namespace }} work. Any CRDs must already exist in the cluster.
# To render an item only on a condition, such as a feature flag of your own, wrap it as
# {when, object}: `when` is true, false, or a template string that counts as false when it
# renders empty, "false", "0", "no", "off" or "null". `when` is optional: {object} alone
# always renders.
#   features:
#     consoleRoute: true
#   extraObjects:
#     - when: "{{ .Values.features.consoleRoute }}"
#       object:
#         apiVersion: route.openshift.io/v1
#         kind: Route
#         metadata:
#           name: '{{ include "platform-probe.fullname" $ }}-console'
#         spec:
#           to: { kind: Service, name: '{{ include "platform-probe.fullname" $ }}-console' }
#           port: { targetPort: http }
#           tls: { termination: edge }
# Avoid on, off, yes and no as flag names: YAML reads those keys as booleans.
extraObjects: []
