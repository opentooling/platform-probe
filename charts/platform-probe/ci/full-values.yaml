# Every optional feature on, as a cluster with OIDC and an external allowed host would run it.
gateway:
  hostname: probe.apps.example.com
  address: 10.0.0.50
  tls:
    issuerContains: internal-ca
auth:
  apiKeys:
    alice: alice-ci-key
    bob: bob-ci-key
  oidc:
    enabled: true
    issuerUrl: https://sso.example.com:8443/realms/api
    clientId: platform-probe
    clientSecret:
      existingSecret: platform-probe-oidc
mesh:
  revision: default
  egress:
    allowedHosts: [api.github.com]
    allowedUrl: https://api.github.com/
trustedCA:
  configMap: my-ca
scratch:
  labels:
    logging.example.com/collect: "true"
    team: "{{ .Release.Namespace }}"
  annotations:
    openshift.io/node-selector: node-role.kubernetes.io/worker=
imagePullSecrets:
  - name: ghcr-pull
suites:
  ingress:
    enabled: true
    certManager:
      issuer:
        name: internal-ca
  pki:
    enabled: true
    issuer:
      name: cluster-ca
    trustBundle:
      configMap: internal-ca-bundle
      key: trust-bundle.pem
    issuerContains: cluster-ca
  workloads:
    enabled: true
    expectQuota: true
  storage:
    enabled: true
    storageClasses: [gp3-csi, ocs-storagecluster-cephfs]
    snapshotClass: csi-aws-vsc
  observability:
    enabled: true
    grafana:
      url: https://grafana.observability.example.com
      token:
        existingSecret: grafana-probe-token
      datasources: { loki: loki, mimir: mimir, tempo: tempo }
    labels:
      extra: { cluster: prod-eu-1 }
    otlp:
      endpoint: http://alloy.alloy.svc:4318
  argocd:
    enabled: true
    instances:
      - name: platform
        namespace: openshift-gitops
        ignore: [sandbox]
      - name: applications
        namespace: gitops-apps
        failOnOutOfSync: false
        deploy:
          enabled: true
          repoURL: https://github.com/opentooling/platform-probe
          path: argocd/probe-app
          revision: main
  metallb:
    enabled: true
    bgpNamespace: openshift-frr-k8s
    pool: public
